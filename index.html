<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Momir</title>
  <style>
    /* ── Reset & Base ── */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0e17;
      color: #fffffe;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* ── Header ── */
    header {
      width: 100%;
      text-align: center;
      padding: 1.25rem 1rem 0.5rem;
    }

    header h1 {
      font-size: 1.6rem;
      letter-spacing: 0.08em;
      color: #ff8906;
    }

    header p {
      font-size: 0.8rem;
      color: #a7a9be;
      margin-top: 0.25rem;
    }

    /* ── Screens ── */
    .screen { display: none; width: 100%; max-width: 420px; padding: 0.75rem; }
    .screen.active { display: flex; flex-direction: column; align-items: center; }

    /* ── CMC Grid ── */
    .cmc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
      width: 100%;
      padding: 0.5rem 0;
    }

    .cmc-btn {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      border: 2px solid #252541;
      color: #fffffe;
      font-size: 1.4rem;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      -webkit-user-select: none;
      user-select: none;
    }

    .cmc-btn:active {
      background: #ff8906;
      border-color: #ff8906;
      color: #0f0e17;
      transform: scale(0.93);
    }

    /* ── Loading ── */
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #252541;
      border-top-color: #ff8906;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 3rem auto 1rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      color: #a7a9be;
      font-size: 0.95rem;
    }

    /* ── Card Display (on-screen) ── */
    .card-image-wrap {
      width: 100%;
      max-width: 300px;
      margin-bottom: 0.75rem;
    }

    .card-image-wrap img {
      width: 100%;
      border-radius: 14px;
      display: block;
    }

    .card-info {
      width: 100%;
      text-align: center;
      margin-bottom: 0.5rem;
    }

    .card-name {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .card-mana {
      margin-top: 0.15rem;
    }

    .card-mana .mana-sym {
      width: 16px;
      height: 16px;
      vertical-align: middle;
    }

    .card-type {
      font-size: 0.85rem;
      color: #a7a9be;
      margin-top: 0.25rem;
    }

    .card-oracle {
      font-size: 0.82rem;
      color: #d1d1e0;
      margin-top: 0.5rem;
      line-height: 1.45;
      max-height: 10rem;
      overflow-y: auto;
      text-align: center;
      width: 100%;
    }

    .card-oracle .mana-sym {
      width: 14px;
      height: 14px;
      vertical-align: middle;
    }

    .card-pt {
      font-size: 1.3rem;
      font-weight: 700;
      color: #ff8906;
      margin-top: 0.4rem;
    }

    /* ── Action Buttons ── */
    .actions {
      display: flex;
      gap: 0.5rem;
      width: 100%;
      margin-top: 1rem;
    }

    .action-btn {
      flex: 1;
      padding: 0.85rem 0.5rem;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    .action-btn:active { transform: scale(0.95); opacity: 0.85; }

    .btn-another { background: #252541; color: #fffffe; }
    .btn-print   { background: #ff8906; color: #0f0e17; }
    .btn-back    { background: #1a1a2e; color: #a7a9be; border: 2px solid #252541; }

    /* ── Error ── */
    .error-msg {
      color: #e53170;
      font-size: 0.95rem;
      text-align: center;
      margin-top: 2rem;
    }

    /* ──────────────────────────────────────────
       Print-only card (looks like a Magic card)
       ────────────────────────────────────────── */
    .print-card { display: none; }

    @media print {
      @page {
        size: 63mm 88mm;
        margin: 0;
      }

      body {
        background: #fff !important;
        color: #000 !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      header,
      #screenGrid,
      #screenLoading,
      #screenError,
      .card-image-wrap,
      .actions,
      .card-info,
      .card-oracle,
      .card-pt {
        display: none !important;
      }

      #screenCard {
        display: block !important;
        padding: 0 !important;
        max-width: none !important;
        width: 63mm;
      }

      .print-card {
        display: block !important;
        width: 63mm;
        height: 88mm;
        border: 2pt solid #000;
        border-radius: 3mm;
        font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif;
        color: #000;
        background: #fff;
        overflow: hidden;
        position: relative;
        padding: 1.5mm;
      }

      /* ── Name bar ── */
      .print-title-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #e0d6c2;
        border: 0.5pt solid #999;
        border-radius: 1.5mm;
        padding: 1mm 2mm;
        margin-bottom: 1mm;
      }

      .print-name {
        font-size: 8pt;
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
        margin-right: 1mm;
      }

      .print-mana {
        display: flex;
        align-items: center;
        gap: 0.5mm;
        flex-shrink: 0;
      }

      .print-mana .mana-sym {
        width: 10px;
        height: 10px;
      }

      /* ── Art box ── */
      .print-art-box {
        width: 100%;
        height: 32mm;
        border: 0.5pt solid #999;
        border-radius: 1mm;
        overflow: hidden;
        margin-bottom: 1mm;
        background: #ddd;
      }

      .print-art-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* ── Type bar ── */
      .print-type-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #e0d6c2;
        border: 0.5pt solid #999;
        border-radius: 1.5mm;
        padding: 1mm 2mm;
        margin-bottom: 1mm;
      }

      .print-type {
        font-size: 7pt;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ── Text box ── */
      .print-text-box {
        background: #f4efe6;
        border: 0.5pt solid #999;
        border-radius: 1.5mm;
        padding: 1.5mm 2mm;
        min-height: 24mm;
        max-height: 32mm;
        overflow: hidden;
        position: relative;
      }

      .print-text {
        font-size: 6.5pt;
        line-height: 1.4;
      }

      .print-text .mana-sym {
        width: 9px;
        height: 9px;
        vertical-align: middle;
      }

      /* ── P/T box ── */
      .print-pt-box {
        position: absolute;
        bottom: 2mm;
        right: 2.5mm;
        background: #e0d6c2;
        border: 0.5pt solid #999;
        border-radius: 1.5mm;
        padding: 0.5mm 2.5mm;
        font-size: 9pt;
        font-weight: 700;
        text-align: center;
        min-width: 10mm;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>MOMIR</h1>
    <p>Tap a mana value to summon a creature</p>
  </header>

  <!-- ── Screen: CMC Grid ── -->
  <div class="screen active" id="screenGrid">
    <div class="cmc-grid" id="cmcGrid"></div>
  </div>

  <!-- ── Screen: Loading ── -->
  <div class="screen" id="screenLoading">
    <div class="spinner"></div>
    <div class="loading-text">Summoning creature&hellip;</div>
  </div>

  <!-- ── Screen: Card ── -->
  <div class="screen" id="screenCard">
    <div class="card-image-wrap">
      <img id="cardImage" alt="Card art" src="">
    </div>

    <div class="actions">
      <button class="action-btn btn-another" id="btnAnother">Another</button>
      <button class="action-btn btn-print"   id="btnPrint">Print</button>
      <button class="action-btn btn-back"    id="btnBack">Back</button>
    </div>

    <!-- Print-only: full card layout -->
    <div class="print-card" id="printCard">
      <div class="print-title-bar">
        <span class="print-name" id="printName"></span>
        <span class="print-mana" id="printMana"></span>
      </div>
      <div class="print-art-box">
        <img id="printArt" alt="" src="">
      </div>
      <div class="print-type-bar">
        <span class="print-type" id="printType"></span>
      </div>
      <div class="print-text-box">
        <div class="print-text" id="printText"></div>
      </div>
      <div class="print-pt-box" id="printPTBox"></div>
    </div>
  </div>

  <!-- ── Screen: Error ── -->
  <div class="screen" id="screenError">
    <div class="error-msg" id="errorMsg"></div>
    <div class="actions" style="margin-top:1.5rem;">
      <button class="action-btn btn-back" id="btnErrorBack" style="flex:0 0 auto; padding:0.85rem 2rem;">Back</button>
    </div>
  </div>

  <script>
    /* ── State ── */
    let currentCMC = 0;

    /* ── Screens ── */
    const screens = {
      grid:    document.getElementById('screenGrid'),
      loading: document.getElementById('screenLoading'),
      card:    document.getElementById('screenCard'),
      error:   document.getElementById('screenError'),
    };

    function show(name) {
      Object.values(screens).forEach(s => s.classList.remove('active'));
      screens[name].classList.add('active');
      window.scrollTo(0, 0);
    }

    /* ────────────────────────────────────────
       Mana symbol renderer
       Parses {W}, {U}, {B}, {R}, {G}, {1}, {X}, {T}, etc.
       and returns HTML with Scryfall SVG icons.
       ──────────────────────────────────────── */
    function renderManaHTML(manaString, symSize) {
      if (!manaString) return '';
      const size = symSize || 16;
      return manaString.replace(/\{([^}]+)\}/g, (match, sym) => {
        /* Scryfall uses uppercase, slashes become hyphens: {W/U} → WU */
        const code = sym.replace('/', '');
        const url = `https://svgs.scryfall.io/card-symbols/${encodeURIComponent(code)}.svg`;
        return `<img class="mana-sym" src="${url}" alt="${match}" width="${size}" height="${size}">`;
      });
    }

    /* Renders oracle text: replaces mana symbols inline, preserves line breaks */
    function renderOracleHTML(oracleText, symSize) {
      if (!oracleText) return '';
      const size = symSize || 14;
      /* Escape HTML entities first */
      const escaped = oracleText
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
      /* Replace mana/tap symbols */
      const withSymbols = escaped.replace(/\{([^}]+)\}/g, (match, sym) => {
        const code = sym.replace('/', '');
        const url = `https://svgs.scryfall.io/card-symbols/${encodeURIComponent(code)}.svg`;
        return `<img class="mana-sym" src="${url}" alt="${match}" width="${size}" height="${size}">`;
      });
      /* Preserve line breaks */
      return withSymbols.replace(/\n/g, '<br>');
    }

    /* ── Build CMC buttons (0-15) ── */
    const grid = document.getElementById('cmcGrid');
    for (let i = 0; i <= 15; i++) {
      const btn = document.createElement('button');
      btn.className = 'cmc-btn';
      btn.textContent = i;
      btn.addEventListener('click', () => fetchCreature(i));
      grid.appendChild(btn);
    }

    /* ── Action buttons ── */
    document.getElementById('btnAnother').addEventListener('click', () => fetchCreature(currentCMC));
    document.getElementById('btnPrint').addEventListener('click',   () => window.print());
    document.getElementById('btnBack').addEventListener('click',    () => show('grid'));
    document.getElementById('btnErrorBack').addEventListener('click', () => show('grid'));

    /* ── Fetch a random creature from Scryfall ── */
    async function fetchCreature(cmc) {
      currentCMC = cmc;
      show('loading');

      try {
        const query = encodeURIComponent(`t:creature cmc=${cmc}`);
        const res = await fetch(`https://api.scryfall.com/cards/random?q=${query}`);

        if (!res.ok) {
          throw new Error(`No creatures at CMC ${cmc}`);
        }

        const card = await res.json();

        /* Handle double-faced / adventure / split cards */
        const face = card.card_faces ? card.card_faces[0] : card;

        const imageUri = card.image_uris
          ? card.image_uris.normal
          : (card.card_faces && card.card_faces[0].image_uris
              ? card.card_faces[0].image_uris.normal
              : '');

        /* Scryfall provides a crop of just the art */
        const artCrop = card.image_uris
          ? card.image_uris.art_crop
          : (card.card_faces && card.card_faces[0].image_uris
              ? card.card_faces[0].image_uris.art_crop
              : imageUri);

        const name      = face.name       || card.name       || 'Unknown';
        const manaCost  = face.mana_cost   || card.mana_cost   || '';
        const typeLine  = face.type_line   || card.type_line   || '';
        const oracle    = face.oracle_text || card.oracle_text || '';
        const power     = face.power       ?? card.power;
        const toughness = face.toughness   ?? card.toughness;
        const pt        = power !== undefined ? `${power}/${toughness}` : '';

        /* ── Screen display ── */
        document.getElementById('cardImage').src = imageUri;

        /* ── Print layout ── */
        document.getElementById('printName').textContent  = name;
        document.getElementById('printMana').innerHTML    = renderManaHTML(manaCost, 10);
        document.getElementById('printType').textContent  = typeLine;
        document.getElementById('printText').innerHTML    = renderOracleHTML(oracle, 9);
        document.getElementById('printArt').src           = artCrop;

        const ptBox = document.getElementById('printPTBox');
        if (pt) {
          ptBox.textContent = pt;
          ptBox.style.display = 'block';
        } else {
          ptBox.style.display = 'none';
        }

        show('card');

      } catch (err) {
        document.getElementById('errorMsg').textContent =
          `No creature found at CMC ${cmc}. This mana value might have no creatures in Magic's history.`;
        show('error');
      }
    }
  </script>
</body>
</html>
