<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Momir</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    /* ── Reset & Base ── */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0e17;
      color: #fffffe;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* ── Header ── */
    header {
      width: 100%;
      text-align: center;
      padding: 1.25rem 1rem 0.5rem;
    }

    header h1 {
      font-size: 1.6rem;
      letter-spacing: 0.08em;
      color: #ff8906;
    }

    header p {
      font-size: 0.8rem;
      color: #a7a9be;
      margin-top: 0.25rem;
    }

    /* ── Screens ── */
    .screen { display: none; width: 100%; max-width: 420px; padding: 0.75rem; }
    .screen.active { display: flex; flex-direction: column; align-items: center; }

    /* ── CMC Grid ── */
    .cmc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
      width: 100%;
      padding: 0.5rem 0;
    }

    .cmc-btn {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      border: 2px solid #252541;
      color: #fffffe;
      font-size: 1.4rem;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      -webkit-user-select: none;
      user-select: none;
    }

    .cmc-btn:active {
      background: #ff8906;
      border-color: #ff8906;
      color: #0f0e17;
      transform: scale(0.93);
    }

    /* ── Loading ── */
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #252541;
      border-top-color: #ff8906;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 3rem auto 1rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      color: #a7a9be;
      font-size: 0.95rem;
    }

    /* ── Card Display (on-screen) ── */
    .card-image-wrap {
      width: 100%;
      max-width: 300px;
      margin-bottom: 0.75rem;
    }

    .card-image-wrap img {
      width: 100%;
      border-radius: 14px;
      display: block;
    }

    /* ── Action Buttons ── */
    .actions {
      display: flex;
      gap: 0.5rem;
      width: 100%;
      margin-top: 1rem;
    }

    .action-btn {
      flex: 1;
      padding: 0.85rem 0.5rem;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    .action-btn:active { transform: scale(0.95); opacity: 0.85; }

    .btn-another { background: #252541; color: #fffffe; }
    .btn-print   { background: #ff8906; color: #0f0e17; }
    .btn-back    { background: #1a1a2e; color: #a7a9be; border: 2px solid #252541; }
    .btn-print.sharing { opacity: 0.5; pointer-events: none; }

    /* ── Error ── */
    .error-msg {
      color: #e53170;
      font-size: 0.95rem;
      text-align: center;
      margin-top: 2rem;
    }

    /* ──────────────────────────────────────────
       Shareable card (rendered to image)
       ────────────────────────────────────────── */
    .print-card {
      position: absolute;
      left: -9999px;
      top: 0;
      width: 450px;
      height: 630px;
      border: 3px solid #000;
      border-radius: 16px;
      font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif;
      color: #000;
      background: #fff;
      overflow: hidden;
      padding: 8px;
    }

    .print-card.rendering {
      left: 0;
      z-index: -1;
    }

    /* ── Name bar ── */
    .print-title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #e0d6c2;
      border: 1px solid #999;
      border-radius: 6px;
      padding: 6px 10px;
      margin-bottom: 5px;
    }

    .print-name {
      font-size: 16px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      margin-right: 6px;
    }

    .print-mana {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    .print-mana .mana-sym {
      width: 18px;
      height: 18px;
    }

    /* ── Art box ── */
    .print-art-box {
      width: 100%;
      height: 240px;
      border: 1px solid #999;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 5px;
      background: #ddd;
    }

    .print-art-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ── Type bar ── */
    .print-type-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #e0d6c2;
      border: 1px solid #999;
      border-radius: 6px;
      padding: 5px 10px;
      margin-bottom: 5px;
    }

    .print-type {
      font-size: 13px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Text box ── */
    .print-text-box {
      background: #f4efe6;
      border: 1px solid #999;
      border-radius: 6px;
      padding: 8px 10px;
      min-height: 180px;
      max-height: 260px;
      overflow: hidden;
    }

    .print-text {
      font-size: 13px;
      line-height: 1.4;
    }

    .print-text .mana-sym {
      width: 14px;
      height: 14px;
      vertical-align: middle;
    }

    /* ── P/T box ── */
    .print-pt-box {
      position: absolute;
      bottom: 10px;
      right: 12px;
      background: #e0d6c2;
      border: 1px solid #999;
      border-radius: 6px;
      padding: 3px 12px;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      min-width: 50px;
    }
  </style>
</head>
<body>

  <header>
    <h1>MOMIR</h1>
    <p>Tap a mana value to summon a creature</p>
    <p style="margin-top:0.3rem;">Brought to you by Dave and Jamie, best friends forever</p>
  </header>

  <!-- ── Screen: CMC Grid ── -->
  <div class="screen active" id="screenGrid">
    <div class="cmc-grid" id="cmcGrid"></div>
  </div>

  <!-- ── Screen: Loading ── -->
  <div class="screen" id="screenLoading">
    <div class="spinner"></div>
    <div class="loading-text">Summoning creature&hellip;</div>
  </div>

  <!-- ── Screen: Card ── -->
  <div class="screen" id="screenCard">
    <div class="card-image-wrap">
      <img id="cardImage" alt="Card art" src="" crossorigin="anonymous">
    </div>

    <div class="actions">
      <button class="action-btn btn-another" id="btnAnother">Another</button>
      <button class="action-btn btn-print"   id="btnPrint">Share</button>
      <button class="action-btn btn-back"    id="btnBack">Back</button>
    </div>
  </div>

  <!-- ── Screen: Error ── -->
  <div class="screen" id="screenError">
    <div class="error-msg" id="errorMsg"></div>
    <div class="actions" style="margin-top:1.5rem;">
      <button class="action-btn btn-back" id="btnErrorBack" style="flex:0 0 auto; padding:0.85rem 2rem;">Back</button>
    </div>
  </div>

  <!-- Offscreen card for rendering to image -->
  <div class="print-card" id="printCard">
    <div class="print-title-bar">
      <span class="print-name" id="printName"></span>
      <span class="print-mana" id="printMana"></span>
    </div>
    <div class="print-art-box">
      <img id="printArt" alt="" src="" crossorigin="anonymous">
    </div>
    <div class="print-type-bar">
      <span class="print-type" id="printType"></span>
    </div>
    <div class="print-text-box">
      <div class="print-text" id="printText"></div>
    </div>
    <div class="print-pt-box" id="printPTBox"></div>
  </div>

  <script>
    /* ── State ── */
    let currentCMC = 0;
    let currentCardName = '';

    /* ── Screens ── */
    const screens = {
      grid:    document.getElementById('screenGrid'),
      loading: document.getElementById('screenLoading'),
      card:    document.getElementById('screenCard'),
      error:   document.getElementById('screenError'),
    };

    function show(name) {
      Object.values(screens).forEach(s => s.classList.remove('active'));
      screens[name].classList.add('active');
      window.scrollTo(0, 0);
    }

    /* ────────────────────────────────────────
       Mana symbol renderer
       ──────────────────────────────────────── */
    function renderManaHTML(manaString, symSize) {
      if (!manaString) return '';
      const size = symSize || 16;
      return manaString.replace(/\{([^}]+)\}/g, (match, sym) => {
        const code = sym.replace('/', '');
        const url = `https://svgs.scryfall.io/card-symbols/${encodeURIComponent(code)}.svg`;
        return `<img class="mana-sym" src="${url}" alt="${match}" width="${size}" height="${size}" crossorigin="anonymous">`;
      });
    }

    function renderOracleHTML(oracleText, symSize) {
      if (!oracleText) return '';
      const size = symSize || 14;
      const escaped = oracleText
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
      const withSymbols = escaped.replace(/\{([^}]+)\}/g, (match, sym) => {
        const code = sym.replace('/', '');
        const url = `https://svgs.scryfall.io/card-symbols/${encodeURIComponent(code)}.svg`;
        return `<img class="mana-sym" src="${url}" alt="${match}" width="${size}" height="${size}" crossorigin="anonymous">`;
      });
      return withSymbols.replace(/\n/g, '<br>');
    }

    /* ── Render card to image and share ── */
    async function shareCard() {
      const btn = document.getElementById('btnPrint');
      btn.classList.add('sharing');
      btn.textContent = 'Wait...';

      try {
        const printCard = document.getElementById('printCard');

        /* Move card on-screen so html2canvas can render it */
        printCard.classList.add('rendering');

        /* Small delay to let images settle */
        await new Promise(r => setTimeout(r, 300));

        const canvas = await html2canvas(printCard, {
          useCORS: true,
          scale: 2,
          backgroundColor: '#ffffff',
        });

        printCard.classList.remove('rendering');

        /* Convert to blob */
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        const file = new File([blob], currentCardName + '.png', { type: 'image/png' });

        /* Share or download */
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            title: currentCardName,
            files: [file],
          });
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = currentCardName + '.png';
          a.click();
          URL.revokeObjectURL(url);
        }
      } catch (err) {
        if (err.name !== 'AbortError') {
          console.error('Share failed:', err);
        }
      } finally {
        btn.classList.remove('sharing');
        btn.textContent = 'Share';
        document.getElementById('printCard').classList.remove('rendering');
      }
    }

    /* ── Build CMC buttons (0-15) ── */
    const grid = document.getElementById('cmcGrid');
    for (let i = 0; i <= 15; i++) {
      const btn = document.createElement('button');
      btn.className = 'cmc-btn';
      btn.textContent = i;
      btn.addEventListener('click', () => fetchCreature(i));
      grid.appendChild(btn);
    }

    /* ── Action buttons ── */
    document.getElementById('btnAnother').addEventListener('click', () => fetchCreature(currentCMC));
    document.getElementById('btnPrint').addEventListener('click',   shareCard);
    document.getElementById('btnBack').addEventListener('click',    () => show('grid'));
    document.getElementById('btnErrorBack').addEventListener('click', () => show('grid'));

    /* ── Fetch a random creature from Scryfall ── */
    async function fetchCreature(cmc) {
      currentCMC = cmc;
      show('loading');

      try {
        const query = encodeURIComponent(`t:creature cmc=${cmc}`);
        const res = await fetch(`https://api.scryfall.com/cards/random?q=${query}`);

        if (!res.ok) {
          throw new Error(`No creatures at CMC ${cmc}`);
        }

        const card = await res.json();

        /* Handle double-faced / adventure / split cards */
        const face = card.card_faces ? card.card_faces[0] : card;

        const imageUri = card.image_uris
          ? card.image_uris.normal
          : (card.card_faces && card.card_faces[0].image_uris
              ? card.card_faces[0].image_uris.normal
              : '');

        const artCrop = card.image_uris
          ? card.image_uris.art_crop
          : (card.card_faces && card.card_faces[0].image_uris
              ? card.card_faces[0].image_uris.art_crop
              : imageUri);

        const name      = face.name       || card.name       || 'Unknown';
        const manaCost  = face.mana_cost   || card.mana_cost   || '';
        const typeLine  = face.type_line   || card.type_line   || '';
        const oracle    = face.oracle_text || card.oracle_text || '';
        const power     = face.power       ?? card.power;
        const toughness = face.toughness   ?? card.toughness;
        const pt        = power !== undefined ? `${power}/${toughness}` : '';

        currentCardName = name;

        /* ── Screen display ── */
        document.getElementById('cardImage').src = imageUri;

        /* ── Print/share layout ── */
        document.getElementById('printName').textContent  = name;
        document.getElementById('printMana').innerHTML    = renderManaHTML(manaCost, 18);
        document.getElementById('printType').textContent  = typeLine;
        document.getElementById('printText').innerHTML    = renderOracleHTML(oracle, 14);
        document.getElementById('printArt').src           = artCrop;

        const ptBox = document.getElementById('printPTBox');
        if (pt) {
          ptBox.textContent = pt;
          ptBox.style.display = 'block';
        } else {
          ptBox.style.display = 'none';
        }

        show('card');

      } catch (err) {
        document.getElementById('errorMsg').textContent =
          `No creature found at CMC ${cmc}. This mana value might have no creatures in Magic's history.`;
        show('error');
      }
    }
  </script>
</body>
</html>
